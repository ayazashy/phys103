name: Deploy PHYS 103 Lab Review to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build

      - name: Restore cached lab MP4 videos
        uses: actions/cache@v4
        with:
          path: dist/videos
          key: phys103-mp4-videos-v1

      - name: Fetch and verify lab MP4 videos for same-origin playback
        run: |
          mkdir -p dist/videos
          declare -A VIDEOS=(
            ["hooke"]="1GJcBNXuujBmKUGnc9jEQp-VXVfN1eOGy"
            ["boyle"]="1NaIgDhlKJnsJPKGqKRCU91wyzKHMoI6q"
            ["freefall"]="1PcPuK2JBuNswXKjhOOWs9uVAyT1Q1Fb1"
            ["viscosity"]="1uYCq4NODZgiwZwyQFENdYhLFjKPzVyUx"
            ["forcetable"]="1muNa4ov8Ck-yXV9al2KvV9nTVaxlWH29"
            ["young"]="1pJQ5zLwImNckrozKW5Ad0uWTZA9mkZsL"
            ["airtrack"]="13tm0T5POl2eoLT-z2m66z3kxfJIM2iAB"
            ["specificheat"]="1RtuDZgdGOQBagU5YB6JxraWyohhQQRo4"
            ["joule"]="1sNF2JUqokEgXeXPCWRF0U23WOmhhEruc"
            ["sound"]="1pxSKznbGZ1S8kna0SbCCMu-kTqMnhLb0"
          )
          for name in "${!VIDEOS[@]}"; do
            id="${VIDEOS[$name]}"
            target="dist/videos/${name}.mp4"
            if [ ! -s "$target" ] || [ "$(wc -c < "$target")" -lt 1000000 ]; then
              echo "Downloading $name ($id)..."
              curl -fsSL --retry 3 "https://drive.usercontent.google.com/download?id=${id}&export=download" -o "$target"
            else
              echo "Using cached $target"
            fi
          done
          ls -lh dist/videos

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
