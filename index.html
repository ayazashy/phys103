  <!-- Restore Dark Mode Preference Before First Paint -->
  <script>
    try {
      if (JSON.parse(localStorage.getItem('phys103_dark_mode_v1') || 'false') === true) {
        document.documentElement.classList.add('dark');
      }
    } catch (e) {}
  </script>
